name = "memories-maybe-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# wrangler d1 create memories-maybe-db 실행 후 아래 database_id 값을
# 콘솔에 출력된 실제 값으로 바꿔주세요 (README-worker.md 참고).
#
# ⚠️ 이미 배포해서 쓰고 계신 경우: 이 파일을 그대로 덮어쓰지 마세요! database_id는
# 이미 발급받은 실제 값을 그대로 유지해야 합니다 (여기 적힌 값은 자리표시자일 뿐이에요).
# name과 database_name 두 줄만 바꾸고 database_id는 기존 값을 그대로 쓰세요.
[[d1_databases]]
binding = "DB"
database_name = "memories-maybe-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
